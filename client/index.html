<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/abes-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABES Event Nexus | ABES Engineering College, Ghaziabad (Autonomous)</title>

      name="description"
      content="India's Premier Campus Hackathon & Club Platform for ABES Engineering College, Ghaziabad. Discover, compete, and build across 19 premier student clubs and societies."
    />
    <!-- Automatic Time-Based Theme: 7:00 AM to 6:59:59 PM Light, 7:00 PM to 6:59:59 AM Dark -->
    <script>
      (function () {
        try {
          var override = sessionStorage.getItem('abes_theme_manual_override');
          var isDark;
          if (override === 'dark') {
            isDark = true;
          } else if (override === 'light') {
            isDark = false;
          } else {
            var h = new Date().getHours();
            isDark = !(h >= 7 && h < 19);
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Modern Typography: Space Grotesk, Instrument Serif, IBM Plex Mono, Plus Jakarta Sans, Alex Brush, Great Vibes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
